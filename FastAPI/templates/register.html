{% extends "base.html" %}

{% block title %}Create Account — Apple Store India{% endblock %}

{% block content %}
<div class="auth-wrapper py-5">
    <div class="auth-card">
        <div class="text-center mb-4">
            <span class="auth-logo">🍎</span>
            <h1 class="auth-title">Create your Apple Account</h1>
            <p class="text-secondary">One account for shopping, order tracking, and support.</p>
        </div>

        <form action="/register" method="post" class="auth-form">
            <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" name="full_name" class="form-input" placeholder="e.g. Manoj Sahu" required autofocus>
            </div>

            <div class="form-group">
                <label for="regEmail">Email Address *</label>
                <input type="email" id="regEmail" name="email" class="form-input" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="regPhone">Phone Number (Optional)</label>
                <input type="tel" id="regPhone" name="phone" class="form-input" placeholder="+91 98765 43210">
            </div>

            <div class="form-group">
                <label for="regPassword">Password * (minimum 6 characters)</label>
                <input type="password" id="regPassword" name="password" class="form-input" placeholder="••••••••" minlength="6" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password *</label>
                <input type="password" id="confirmPassword" name="confirm_password" class="form-input" placeholder="••••••••" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 mt-2">Create Account</button>
        </form>

        <div class="auth-footer text-center mt-4">
            <p>Already have an account? <a href="/login">Sign in</a></p>
        </div>
    </div>
</div>
{% endblock %}
